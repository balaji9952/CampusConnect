# ============================================================
# CampusConnect -- Nginx for Windows Configuration
# ============================================================
#
# Target OS : Windows Server / Windows 10 / Windows 11
# Nginx     : Nginx for Windows  (https://nginx.org/en/docs/windows.html)
#
# Architecture:
#   Browser --> Nginx (port 80)
#               |-- /           --> Admin Portal static files (disk)
#               |-- /api/*      --> http://localhost:3019  (Node.js backend)
#               |-- /uploads/*  --> http://localhost:3019  (backend file store)
#               |-- /scan/*     --> http://localhost:3019  (QR redirect page)
#               |-- /health     --> http://localhost:3019  (health check)
#               |-- /api-docs/* --> http://localhost:3019  (Swagger UI)
#               `-- /socket.io/--> http://localhost:3019  (Socket.IO WebSocket)
#
# Usage (Windows):
#   1. Copy this file to  C:/nginx/conf/nginx.conf
#      (replace the default nginx.conf shipped with Nginx for Windows)
#   2. Edit the path marked  <-- UPDATE THIS PATH  below
#   3. From an Administrator Command Prompt or PowerShell:
#        cd C:\nginx
#        nginx.exe -t          (test config -- must show "syntax is ok")
#        nginx.exe             (start Nginx)
#
# IMPORTANT -- Nginx for Windows path rules:
#   Use FORWARD slashes  /  NOT backslashes  \
#   Correct : C:/CampusConnect/admin-portal
#   Wrong   : C:\CampusConnect\admin-portal
# ============================================================

# -- Worker processes -------------------------------------------------------
# Nginx for Windows runs single-threaded; keep worker_processes at 1.
worker_processes  1;

# -- Error log -------------------------------------------------------------
error_log logs/error.log warn;

# -- PID file --------------------------------------------------------------
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Access log
    access_log logs/campus-connect-access.log;

    sendfile        on;
    keepalive_timeout  65;

    # Must match the backend limit (backend-api accepts up to 50mb bodies)
    client_max_body_size 50M;

    # -- Upstream: Node.js backend -----------------------------------------
    upstream campus_connect_api {
        server 127.0.0.1:3019;
        keepalive 32;
    }

    # -- Rate limiting zones -----------------------------------------------
    # Included in the standard Nginx for Windows build.
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # =========================================================================
    # Main Server Block
    # =========================================================================
    server {
        listen       80;

        # server_name _ is a catch-all: matches localhost, the server IP,
        # or any hostname.  Change _ to a real domain if one is assigned later.
        server_name  _;

        # -- Logging -----------------------------------------------------------
        access_log   logs/campus-connect-access.log;
        error_log    logs/campus-connect-error.log warn;

        # -- Security Headers --------------------------------------------------
        add_header X-Frame-Options         "SAMEORIGIN"                     always;
        add_header X-Content-Type-Options  "nosniff"                        always;
        add_header X-XSS-Protection        "1; mode=block"                  always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # =====================================================================
        # STATIC FILE ROOT -- Admin Portal
        #
        # Set this to the Windows path where admin-portal is deployed.
        # Use FORWARD SLASHES.
        #
        # Default assumed path: C:/CampusConnect/admin-portal
        # Change to wherever you copy the admin-portal folder on this server.
        # =====================================================================
        location / {
            root   C:/CampusConnect/admin-portal;   # <-- UPDATE THIS PATH
            index  login.html;
            try_files $uri $uri/ =404;

            # Cache JS/CSS/images 7 days; HTML files never cached (hot-deploy)
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
                expires 7d;
                add_header Cache-Control "public, immutable";
            }
        }

        # =====================================================================
        # BACKEND PROXY LOCATIONS
        # All routes below are forwarded to Node.js on localhost:3019
        # =====================================================================

        # -- REST API ----------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;

            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # -- Auth login: tighter rate limit ------------------------------------
        location /api/auth/login {
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # -- Uploaded files (ticket photos, QR images) -------------------------
        # Proxied to Node.js. The backend already serves this via express.static().
        # Proxying avoids Windows alias path issues and permission complexities.
        location /uploads/ {
            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # -- QR Scan redirect page ---------------------------------------------
        location /scan/ {
            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # -- Health Check ------------------------------------------------------
        location /health {
            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            add_header         Cache-Control     "no-store";
        }

        # -- Swagger API Docs --------------------------------------------------
        location /api-docs/ {
            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # -- Socket.IO WebSocket -----------------------------------------------
        location /socket.io/ {
            proxy_pass         http://campus_connect_api;
            proxy_http_version 1.1;

            # WebSocket upgrade headers (required for Socket.IO)
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket connections are long-lived
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # -- Deny access to sensitive file types -------------------------------
        location ~ /\. {
            deny all;
        }
        location ~* \.(env|prisma|sql|ts|log|ps1)$ {
            deny all;
        }

        # =====================================================================
        # Adding SSL Later
        # =====================================================================
        # DO NOT configure SSL now.  Follow these steps when certificates are ready:
        #
        # Step 1.  Obtain a certificate using one of:
        #   - win-acme  https://www.win-acme.com/  (free, Let`s Encrypt, Windows GUI)
        #   - Certbot Windows build                (command-line)
        #   - A commercial CA                      (export .pem files)
        #
        # Step 2.  Place certificate files in  C:/nginx/ssl/
        #   C:/nginx/ssl/fullchain.pem
        #   C:/nginx/ssl/privkey.pem
        #
        # Step 3.  Change the listen line in this file:
        #     listen 443 ssl;
        #
        # Step 4.  Add inside the server { } block:
        #     ssl_certificate      C:/nginx/ssl/fullchain.pem;
        #     ssl_certificate_key  C:/nginx/ssl/privkey.pem;
        #     ssl_protocols        TLSv1.2 TLSv1.3;
        #     ssl_ciphers          HIGH:!aNULL:!MD5;
        #
        # Step 5.  Add a separate HTTP->HTTPS redirect block BEFORE this server block:
        #     server {
        #         listen      80;
        #         server_name _;
        #         return 301  https://$host$request_uri;
        #     }
        #
        # Step 6.  Test and reload:
        #     nginx.exe -t
        #     nginx.exe -s reload
        # =====================================================================
    }
}
