<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Feedback - Campus Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/common.css?v=3.0">
  <link rel="stylesheet" href="assets/css/complaints.css">
</head>
<body>

  <div id="app-view" class="view active">
    <div id="topbar-container" class="topbar"></div>

    <div class="layout">
      <div id="sidebar-container" class="sidebar"></div>

      <div class="content">
        <div class="page active" id="page-complaints">
          <div class="page-title" data-i18n="nav_complaints">My Feedback</div>
          <div class="page-sub" data-i18n="complaints_sub">Track and manage all your submitted feedback</div>
          <div class="filter-row">
            <button class="filter-btn active" data-f="All" data-i18n="filter_all">All</button>
            <button class="filter-btn" data-f="Pending" data-i18n="status_pending">Pending</button>
            <button class="filter-btn" data-f="In Progress" data-i18n="status_progress">In Progress</button>
            <button class="filter-btn" data-f="Resolved" data-i18n="status_resolved">Resolved</button>
          </div>
          <div id="complaints-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-detail">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:20px">
        <div>
          <div class="modal-title" id="d-id"></div><span class="badge" id="d-badge"></span>
        </div>
        <button onclick="window.closeModal('modal-detail')"
          style="border:none;background:transparent;cursor:pointer;font-size:22px;color:#7B8BB2;line-height:1">&times;</button>
      </div>
      <div class="detail-section">
        <div class="detail-label" data-i18n="field_desc">Description</div>
        <div class="detail-val" id="d-desc" style="line-height:1.6"></div>
      </div>
      <div class="detail-sep"></div>
      <div class="detail-section">
        <div class="detail-label" data-i18n="detail_parent">Parent</div>
        <div class="detail-val" id="d-parent"></div>
      </div>
      <div class="detail-sep"></div>
      <div class="detail-section">
        <div class="detail-label" data-i18n="detail_mobile">Mobile</div>
        <div class="detail-val" id="d-mobile"></div>
      </div>
      <div class="detail-sep"></div>
      <div class="detail-section">
        <div class="detail-label" data-i18n="detail_submitted">Submitted On</div>
        <div class="detail-val" id="d-date"></div>
      </div>
    </div>
  </div>

  <div id="toast"><span id="toast-msg"></span></div>
  <script type="module" src="assets/js/complaints.js"></script>
</body>
</html>
