<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Campus Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/common.css?v=3.0">
  <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>

  <div id="app-view" class="view active">
    <div id="topbar-container" class="topbar"></div>

    <div class="layout">
      <div id="sidebar-container" class="sidebar"></div>

      <div class="content">
        <div class="page active" id="page-home">
          <div class="greeting-card">
            <div class="greeting-hi" data-i18n="greeting_hi">Good day,</div>
            <div class="greeting-name" id="greet-name">Google User</div>
            <button class="btn-submit" onclick="window.openSubmitModal()"><i class="ti ti-plus"></i> <span
                data-i18n="btn_submit_new">Submit New Feedback</span></button>
          </div>
          <div class="stats-grid" id="stats-grid"></div>
          <div class="section-hd">
            <h3 data-i18n="recent_complaints">Recent Feedback</h3>
            <a class="view-all" href="complaints.html" data-i18n="view_all">View All →</a>
          </div>
          <div id="recent-list"></div>
          
        </div>
      </div>
    </div>
  </div>

  <!-- Submit Modal -->
  <div class="modal-overlay" id="modal-submit">
    <div class="modal-box">
      <div class="modal-title" data-i18n="submit_title">Submit Feedback</div>
      <div class="modal-sub" data-i18n="submit_sub">We value your feedback and suggestions</div>
      <div class="mfield">
        <label data-i18n="field_desc">Description</label>
        <textarea id="m-desc" placeholder="Describe your feedback in detail..."></textarea>
        <div class="mfield-err" id="m-desc-err"></div>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="window.closeModal('modal-submit')" data-i18n="btn_cancel">Cancel</button>
        <button class="btn-primary" id="btn-submit-complaint" data-i18n="btn_submit">Submit</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-success">
    <div class="modal-box">
      <div class="success-box">
        <div class="success-icon"><i class="ti ti-circle-check"></i></div>
        <div class="success-title" data-i18n="success_title">Feedback Submitted!</div>
        <div class="success-sub" data-i18n="success_sub">Your feedback has been registered successfully</div>
        <div class="ticket-id-box">
          <div>
            <div class="ticket-id-label" data-i18n="ticket_id">Ticket ID</div>
            <div class="ticket-id-val" id="success-ticket-id">TKT-000000</div>
          </div>
          <button class="copy-btn" id="btn-copy-ticket"><i class="ti ti-copy"></i> <span data-i18n="btn_copy">Copy</span></button>
        </div>
        <button class="btn-primary" onclick="window.closeModal('modal-success'); window.location.href='complaints.html'" style="width:100%" data-i18n="btn_done">Done</button>
      </div>
    </div>
  </div>

  <div id="toast"><span id="toast-msg"></span></div>
  <script type="module" src="assets/js/dashboard.js"></script>
</body>
</html>
