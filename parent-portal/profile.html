<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Campus Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="assets/css/common.css?v=3.0">
  <link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>

  <div id="app-view" class="view active">
    <div id="topbar-container" class="topbar"></div>

    <div class="layout">
      <div id="sidebar-container" class="sidebar"></div>

      <div class="content">
        <div class="page active" id="page-profile">
          <div class="page-title" data-i18n="nav_profile">My Profile</div>
          <div class="page-sub" data-i18n="profile_sub">Manage your account information</div>
          
          <div class="profile-header">
            <div class="avatar-wrap">
              <div class="avatar-lg" id="profile-avatar">GU</div>
              <button class="avatar-upload-btn" id="btn-upload-photo" onclick="document.getElementById('photo-input').click()"
                title="Upload photo" style="display:none"><i class="ti ti-camera"></i></button>
              <input type="file" id="photo-input" accept="image/*" style="display:none">
            </div>
            <div style="flex:1;min-width:0">
              <div class="profile-name" id="profile-disp-name">Google User</div>
              <div class="profile-email" id="profile-disp-email">googleuser@example.com</div>
            </div>
            <button class="btn-edit" id="profile-edit-btn" style="margin-left:auto;flex-shrink:0"><i class="ti ti-edit"></i> <span data-i18n="btn_edit">Edit</span></button>
          </div>

          <div class="profile-card">
            <div class="profile-row">
              <div class="profile-row-icon"><i class="ti ti-user"></i></div>
              <div style="flex:1;min-width:0">
                <div class="profile-row-label" data-i18n="field_name">Full Name</div>
                <div class="profile-row-val" id="pv-name">Google User</div>
                <input class="profile-input" id="pi-name" value="Google User" style="display:none">
              </div>
            </div>
            <div class="profile-row">
              <div class="profile-row-icon"><i class="ti ti-mail"></i></div>
              <div style="flex:1;min-width:0">
                <div class="profile-row-label" data-i18n="field_email">Email Address</div>
                <div class="profile-row-val" id="pv-email">googleuser@example.com</div>
                <input class="profile-input" id="pi-email" value="googleuser@example.com" style="display:none">
              </div>
            </div>
            <div class="profile-row">
              <div class="profile-row-icon"><i class="ti ti-phone"></i></div>
              <div style="flex:1;min-width:0">
                <div class="profile-row-label" data-i18n="field_phone">Phone Number</div>
                <div class="profile-row-val" id="pv-phone">—</div>
                <input class="profile-input" id="pi-phone" value="" style="display:none" placeholder="+91 9XXXXXXXXX">
              </div>
            </div>
            <div class="profile-row">
              <div class="profile-row-icon"><i class="ti ti-language"></i></div>
              <div style="flex:1;min-width:0">
                <div class="profile-row-label" data-i18n="field_language">Preferred Language</div>
                <div class="profile-row-val" id="pv-lang">English</div>
                <select class="lang-select-row" id="pi-lang" style="display:none">
                  <option value="en">🇬🇧 English</option>
                  <option value="ta">🇮🇳 தமிழ்</option>
                </select>
              </div>
            </div>
          </div>



        </div>
      </div>
    </div>
  </div>

  

  <div id="toast"><span id="toast-msg"></span></div>
  <script type="module" src="assets/js/profile.js"></script>
</body>
</html>
