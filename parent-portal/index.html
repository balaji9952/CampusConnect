<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Connect - Parent Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="assets/css/common.css?v=3.0">
</head>

<body>

  <div id="lang-view" class="view active">
    <div class="lang-logo-wrap"><img src="assets/images/parent_logo.png" alt="Campus Connect Logo"
        style="width:100%;height:100%;border-radius:50%;"></div>
    <div class="lang-app-name">Campus Connect</div>
    <div class="lang-tagline">Parent Feedback Portal</div>
    <div class="lang-card">
      <h2 id="lang-choose-label">Choose Your Language / மொழியை தேர்வு செய்யுங்கள்</h2>
      <button class="lang-btn selected" id="lang-en-btn" onclick="selectLang('en')">
        <span class="lang-flag">🇬🇧</span>
        <span class="lang-name">English</span>
        <i class="ti ti-circle-check lang-check"></i>
      </button>
      <button class="lang-btn" id="lang-ta-btn" onclick="selectLang('ta')">
        <span class="lang-flag">🇮🇳</span>
        <span class="lang-name">தமிழ்</span>
        <i class="ti ti-circle-check lang-check"></i>
      </button>
      <button class="btn-continue" id="lang-continue-btn" onclick="goToWelcome()">Continue / தொடர்க</button>
    </div>
  </div>

  <div id="welcome-view" class="view">
    <div class="lang-logo-wrap">
      <img src="assets/images/parent_logo.png" alt="Campus Connect Logo" style="width:100%;height:100%;border-radius:50%;">
    </div>
    <div class="lang-app-name">Campus Connect</div>
    <div class="lang-tagline" id="w-tagline">Sign in to your parent account</div>
    <div class="welcome-card">
      <div class="welcome-title" id="w-title">Welcome</div>
      <div class="welcome-sub" id="w-sub">Sign in with your credentials</div>

      <div style="margin-top: 32px; display: flex; justify-content: center;">
        <div id="google-btn"></div>
      </div>
    </div>
  </div>

  <!-- Toasts container -->
  

  <div id="toast"><span id="toast-msg"></span></div>
  <script type="module">
    import { setLang, getLang, applyLang } from './assets/js/translations.js';
    import { isLoggedIn, googleLogin, getProfile, setToken } from './assets/js/auth.js';
    import { appShowToast } from './assets/js/shared.js';
    import { fetchApi } from './assets/js/api.js';

    window.selectLang = function (l) {
      setLang(l);
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('lang-' + l + '-btn').classList.add('selected');
      document.getElementById('lang-continue-btn').disabled = false;
    };

    window.goToWelcome = function () {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('welcome-view').classList.add('active');
      applyLang();
    };

    window.handleCredentialResponse = async function (response) {
      appShowToast('Verifying Google sign-in...', 'info');
      const res = await googleLogin(response.credential);
      if (res.status === 200 && res.data.success) {
        window.location.href = 'dashboard.html';
      } else {
        appShowToast(res.data.message || 'Google login failed', 'error');
      }
    };

    async function initGoogleSignIn() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleSignIn, 100);
        return;
      }
      try {
        const configRes = await fetchApi('/auth/config');
        if (configRes.status === 200 && configRes.data.success) {
          const config = configRes.data.data;
          google.accounts.id.initialize({
            client_id: config.googleClientId,
            callback: window.handleCredentialResponse,
            ux_mode: 'popup'
          });
          const btnDiv = document.getElementById('google-btn');
          if (btnDiv) {
            google.accounts.id.renderButton(btnDiv, {
              type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', logo_alignment: 'left'
            });
          }
        }
      } catch (e) {
        console.error('Failed to init google sign in', e);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Set initial language UI
      const l = getLang();
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('selected'));
      const btn = document.getElementById('lang-' + l + '-btn');
      if (btn) btn.classList.add('selected');

      // Auto login check
      if (isLoggedIn()) {
        const res = await getProfile();
        if (res.status === 200 && res.data.success) {
          localStorage.setItem('currentUser', JSON.stringify(res.data.data));
          window.location.href = 'dashboard.html';
        } else {
          setToken(null);
        }
      }
      initGoogleSignIn();
      applyLang();
    });
  </script>
</body>

</html>
