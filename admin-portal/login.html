<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Connect Admin Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: url("assets/images/college-bg.jpeg") center center no-repeat;
            background-size: cover;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
        }

        .login-container {
            position: relative;
            z-index: 1;

            width: 350px;
            padding: 30px;

            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.25);

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            background: white;
            border: 3px solid white;
            padding: 3px;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .password-wrapper {
            position: relative;
        }

        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0 20px;
            color: white;
            font-size: 14px;
        }

        .options a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .options a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #1A73E8;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0d5dd6;
        }

        .error-message {
            display: none;
            color: #ffb3b3;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .login-container {
                width: 90%;
                padding: 25px;
            }

            .title {
                font-size: 26px;
            }
        }
    </style>
  <script src="assets/js/theme.js"></script>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <img src="assets/images/mzcetlogo.jpg" alt="College Logo">
        </div>

        <div class="title">Campus Connect</div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter Username">
        </div>

        <div class="form-group">
            <label>Password</label>

            <div class="password-wrapper">
                <input type="password" id="password" class="form-control" placeholder="Enter Password">
                <span class="eye-btn" onclick="togglePassword()">👁️</span>
            </div>
        </div>

        <div id="error-message" class="error-message">
            Invalid Username or Password
        </div>

        <div class="options">
            <label><input type="checkbox"> Remember Me</label>
            <a href="#" onclick="forgotPassword()">Forgot Password?</a>
        </div>

        <button class="login-btn" onclick="goToAdmin()">Login</button>

    </div>

    <script src="js/api.js?v=2"></script>
    <!-- Cache buster for CSP fix -->
    <script>

        function togglePassword() {
            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }

        async function goToAdmin() {
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("error-message");
            const btn = document.querySelector(".login-btn");

            if (!user || !pass) {
                errorMsg.textContent = "Please enter both username and password.";
                errorMsg.style.display = "block";
                return;
            }

            try {
                btn.textContent = "Logging in...";
                btn.disabled = true;
                errorMsg.style.display = "none";

                // Send login request to the actual backend API
                // Assuming Role 3 is Admin based on backend configuration
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: user,
                        password: pass,
                        role: 3
                    })
                });

                const data = await response.json();

                if (response.ok && data.token) {
                    // Save the real JWT token
                    localStorage.setItem("admin_token", data.token);

                    // Optionally save user data
                    if (data.user) {
                        localStorage.setItem("admin_user", JSON.stringify(data.user));
                    }

                    // Redirect to dashboard
                    window.location.href = "./user-management.html";
                } else {
                    errorMsg.textContent = data.message || "Invalid credentials or unauthorized.";
                    errorMsg.style.display = "block";
                    btn.textContent = "Sign In";
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = "Error: " + err.message + " (" + err.name + ")";
                errorMsg.style.display = "block";
                btn.textContent = "Sign In";
                btn.disabled = false;
            }
        }

        function forgotPassword() {
            alert("Please contact the Administrator.");
        }
    </script>

  <script type="module" src="firebase.js"></script>
</body>

</html>
