name: campus_connect
description: "QR Based Feedback & Escalation System for campus complaint management"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  image_picker: ^1.2.1
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: any
  http_parser: ^4.1.2
  mobile_scanner: ^6.0.0
  socket_io_client: ^3.1.6
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.jpeg"
